<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Shil Niwas</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #FAFAF8;
      color: #1F2937;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      text-align: center;
    }
    .box { max-width: 320px; }
    h1 { font-size: 18px; margin-bottom: 8px; }
    p { font-size: 14px; color: #6B7280; line-height: 1.5; }
    button {
      margin-top: 16px;
      background: #1F2937;
      color: #FAFAF8;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>You're offline</h1>
    <p>This page hasn't been saved for offline viewing yet. Pages you've already opened — like an agreement or a rent receipt — will still work without internet.</p>
    <button onclick="window.location.reload()">Try again</button>
  </div>
</body>
</html>
